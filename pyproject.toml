[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ── Project metadata ──────────────────────────────────────────────────────────
[project]
name = "athena"
version = "0.1.0"
description = "AI-powered quantitative research and automated trading platform for Indian derivative markets"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Athena Platform Engineering" }]
keywords = [
  "quantitative-finance",
  "algorithmic-trading",
  "indian-markets",
  "derivatives",
  "nse",
  "bse",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial :: Investment",
  "Typing :: Typed",
]

# ── Runtime dependencies ──────────────────────────────────────────────────────
# Keep this list minimal. Engine-specific dependencies belong in engine extras.
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "structlog>=24.2",
  "httpx>=0.27",
  "anyio>=4.4",
  "typer>=0.12",
  # tzdata provides the IANA timezone database in environments without a
  # system tzdb (minimal Alpine images, Windows, CI containers).
  # zoneinfo (stdlib) uses this package automatically when present.
  "tzdata>=2024",
]

[project.scripts]
athena = "athena.interfaces.cli:app"

[project.urls]
Repository = "https://github.com/ramankedar/athena"
Issues = "https://github.com/ramankedar/athena/issues"
Changelog = "https://github.com/ramankedar/athena/blob/main/CHANGELOG.md"

# ── Hatch build configuration ─────────────────────────────────────────────────
[tool.hatch.build.targets.wheel]
packages = ["src/athena"]

# ── Dependency groups (PEP 735, uv-native) ───────────────────────────────────
# Install with: uv sync --group <name>
# Install all:  uv sync --all-groups
[dependency-groups]
dev = [
  "pre-commit>=3.7",
  "commitizen>=3.29",
  "import-linter>=2.1",
  { include-group = "test" },
  { include-group = "lint" },
]
test = [
  "pytest>=8.2",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "pytest-xdist>=3.5",
  "hypothesis>=6.112",
  "respx>=0.21",
  "freezegun>=1.5",
  "types-freezegun>=1.1",
]
lint = [
  "ruff>=0.8",
  "mypy>=1.13",
]
docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.25",
]

# ── Ruff ─────────────────────────────────────────────────────────────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "W",    # pycodestyle warnings
  "F",    # pyflakes
  "I",    # isort
  "N",    # pep8-naming
  "UP",   # pyupgrade
  "B",    # flake8-bugbear
  "S",    # flake8-bandit (security)
  "SIM",  # flake8-simplify
  "TCH",  # flake8-type-checking (move imports into TYPE_CHECKING blocks)
  "ANN",  # flake8-annotations
  "PT",   # flake8-pytest-style
  "C90",  # McCabe complexity
  "RUF",  # ruff-specific rules
  "PERF", # perflint
  "LOG",  # flake8-logging
]
ignore = [
  "ANN401", # Dynamically typed expressions (Any) — needed in some adapters
  "UP046",  # Generic class type-parameter syntax (PEP 695): deferred for wider tooling compat
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN", "PLR2004", "TC001", "TC003"]
"src/athena/market_data/ohlcv.py" = ["C901"]
"src/athena/market_data/validation.py" = ["C901"]
"scripts/**/*.py" = ["S", "ANN", "T201"]
"docs/**/*.py" = ["ANN", "INP001"]

[tool.ruff.lint.isort]
known-first-party = ["athena"]
force-sort-within-sections = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

# ── mypy ─────────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^docs/", "^scripts/", "^notebooks/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true

# ── pytest ────────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
  "--tb=short",
  "--strict-markers",
  "--strict-config",
  "-ra",
]
markers = [
  "unit: Fast, isolated unit tests with no I/O (deselect with '-m not unit')",
  "integration: Tests requiring live services (TimescaleDB, Redis)",
  "e2e: End-to-end tests against the full stack",
  "slow: Tests with significant wall-clock time",
]

# ── Coverage ──────────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src/athena"]
branch = true
omit = ["*/tests/*", "*/__init__.py", "*/interfaces/cli*"]

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "@overload",
  "raise NotImplementedError",
  "\\.\\.\\.\\s*$",
  "class .*\\(Protocol\\):",
]

# ── Commitizen (conventional commits + semantic versioning) ───────────────────
[tool.commitizen]
name = "cz_conventional_commits"
tag_format = "v$version"
version_scheme = "semver"
version_provider = "pep621"
update_changelog_on_bump = true
major_version_zero = true
