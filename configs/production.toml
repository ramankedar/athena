# ── Production environment configuration ─────────────────────────────────────
# All secrets injected from the secrets manager via environment variables.
# This file contains ONLY non-secret operational parameters.

[platform]
log_level = "INFO"

[database]
port = 5432
name = "athena"
user = "athena"
# host:     ATHENA_DATABASE__HOST
# password: ATHENA_DATABASE__PASSWORD

[redis]
max_connections = 50
# url: ATHENA_REDIS__URL

[market]
session_timezone = "Asia/Kolkata"
instruments = [
  "NSE:NIFTY50-INDEX",
  "NSE:NIFTYBANK-INDEX",
  "BSE:SENSEX-INDEX",
  "BSE:BANKEX-INDEX",
]
